<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">drizzle-scoped-db</title>
  <desc id="desc">Typed and runtime guardrails that catch accidental unscoped queries in Drizzle ORM.</desc>

  <defs>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="errClip">
      <rect x="744" y="332" width="400" height="92" rx="12"/>
    </clipPath>
  </defs>

  <!-- flat background -->
  <rect width="1280" height="640" fill="#0B0F14"/>

  <!-- wordmark: "scoped" carries the value -->
  <text x="104" y="150" font-family="Adwaita Sans, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#C7D0DA">drizzle-</tspan><tspan fill="#A3E635">scoped</tspan><tspan fill="#C7D0DA">-db</tspan>
  </text>

  <!-- headline: red = what it catches -->
  <g font-family="Adwaita Sans, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5">
    <text x="104" y="270" fill="#E8EDF3">Typed + runtime guardrails</text>
    <text x="104" y="318" fill="#E8EDF3">that catch accidental</text>
    <text x="104" y="366" fill="#FF7A7A">unscoped queries</text>
  </g>

  <!-- ecosystem -->
  <text x="104" y="416" font-family="Adwaita Sans, sans-serif" font-size="22" font-weight="600" fill="#8893A0" letter-spacing="0">for <tspan fill="#C7D0DA">Drizzle ORM</tspan></text>

  <!-- code proof panel -->
  <g filter="url(#panelShadow)">
    <rect x="708" y="168" width="468" height="296" rx="20" fill="#0F141A" stroke="#FFFFFF" stroke-opacity="0.07"/>
  </g>
  <g font-family="JetBrainsMono Nerd Font Mono, monospace" font-size="21">
    <text x="740" y="220" fill="#5E6B79" font-weight="500">// missing the org filter</text>
    <text x="740" y="266" font-weight="600" xml:space="preserve"><tspan fill="#7C8896">await </tspan><tspan fill="#A3E635">orgDb</tspan></text>
    <text x="740" y="300" font-weight="600"><tspan fill="#7C8896">  .select().from(</tspan><tspan fill="#D4DCE4">projects</tspan><tspan fill="#7C8896">)</tspan></text>

    <!-- error tag -->
    <g clip-path="url(#errClip)">
      <rect x="744" y="332" width="400" height="92" fill="#FF7A7A" fill-opacity="0.08"/>
      <rect x="744" y="332" width="5" height="92" fill="#FF7A7A"/>
    </g>
    <rect x="744" y="332" width="400" height="92" rx="12" fill="none" stroke="#FF7A7A" stroke-opacity="0.30"/>
    <text x="772" y="372" font-size="20" font-weight="700" fill="#FF9090">MissingScopedWhereError</text>
    <text x="772" y="400" font-size="16" font-weight="500" fill="#B98686">caught at the call site, not in prod</text>
  </g>
</svg>
