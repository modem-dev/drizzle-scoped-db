<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="618" viewBox="8 141 1584 618" role="img" aria-labelledby="title">
  <title id="title">drizzle-scoped-db before and after</title>
  <defs>
    <filter id="ps" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#0B0F14"/>

  <g transform="translate(0 -15)">

  <!-- ============ LEFT: without ============ -->
  <g filter="url(#ps)">
    <rect x="72" y="220" width="696" height="490" rx="22" fill="#0F141A" stroke="#FFFFFF" stroke-opacity="0.07"/>
  </g>
  <text x="116" y="302" font-family="Adwaita Sans, sans-serif" font-size="28" font-weight="700" fill="#C7D0DA">Plain Drizzle handle</text>
  <line x1="108" y1="336" x2="732" y2="336" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <g font-family="JetBrainsMono Nerd Font Mono, monospace">
    <text x="116" y="410" font-size="29" font-weight="500" fill="#5E6B79">// forgot the org filter</text>
    <text x="116" y="468" font-size="34" font-weight="600" xml:space="preserve"><tspan fill="#7C8896">await </tspan><tspan fill="#D4DCE4">db</tspan></text>
    <text x="150" y="514" font-size="34" font-weight="600"><tspan fill="#7C8896">.select().from(</tspan><tspan fill="#D4DCE4">projects</tspan><tspan fill="#7C8896">)</tspan></text>
  </g>
  <line x1="108" y1="566" x2="732" y2="566" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <text x="116" y="630" font-family="Adwaita Sans, sans-serif" font-size="33" font-weight="800" fill="#FF9090">Returns every org's rows</text>
  <text x="116" y="674" font-family="JetBrainsMono Nerd Font Mono, monospace" font-size="22" font-weight="500" fill="#B58484">no error thrown, it silently leaks</text>

  <!-- ============ RIGHT: with ============ -->
  <g filter="url(#ps)">
    <rect x="832" y="220" width="696" height="490" rx="22" fill="#0F141A" stroke="#FFFFFF" stroke-opacity="0.07"/>
  </g>
  <text x="876" y="302" font-family="Adwaita Sans, sans-serif" font-size="28" font-weight="700" fill="#C7D0DA">With <tspan fill="#A3E635">drizzle-scoped-db</tspan></text>
  <line x1="868" y1="336" x2="1492" y2="336" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <g font-family="JetBrainsMono Nerd Font Mono, monospace">
    <text x="876" y="410" font-size="29" font-weight="500" fill="#5E6B79">// org-scoped handle</text>
    <text x="876" y="468" font-size="34" font-weight="600" xml:space="preserve"><tspan fill="#7C8896">await </tspan><tspan fill="#A3E635">orgDb</tspan></text>
    <text x="910" y="514" font-size="34" font-weight="600"><tspan fill="#7C8896">.select().from(</tspan><tspan fill="#D4DCE4">projects</tspan><tspan fill="#7C8896">)</tspan></text>
  </g>
  <line x1="868" y1="566" x2="1492" y2="566" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <text x="876" y="630" font-family="Adwaita Sans, sans-serif" font-size="33" font-weight="800" fill="#BEF264">Caught before it ships</text>
  <text x="876" y="674" font-family="JetBrainsMono Nerd Font Mono, monospace" font-size="22" font-weight="500" fill="#8FA869">throws MissingScopedWhereError</text>

  </g>
</svg>
